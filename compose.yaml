name: database-bot

services:
  bot:
    build:
      context: .
    image: database-bot:latest
    container_name: database-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/turbo_search.sqlite
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=268435456,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.25
    mem_limit: 1200m
    memswap_limit: 1600m
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
